  <style>
    :root {
      --bg: #f6f7f4;
      --panel: #fff;
      --panel-soft: #f9faf7;
      --text: #1f2933;
      --muted: #68717d;
      --line: #dfe5df;
      --ink: #1f3a3d;
      --green: #2f7d62;
      --orange: #c26a2e;
      --red: #bf4a3d;
      --blue: #2f6f9f;
      --rain: #327a9c;
      --shadow: 0 12px 34px rgba(31, 41, 51, 0.08);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; font-family: Inter, "Segoe UI", Roboto, "Noto Sans SC", Arial, sans-serif; color: var(--text); background: var(--bg); }
    body { overflow: hidden; }
    button, select, input { font: inherit; }
    button { border: 0; cursor: pointer; }

    .app-shell { display: grid; grid-template-columns: 320px minmax(0, 1fr); height: 100vh; min-height: 0; }
    .sidebar { background: var(--panel); border-right: 1px solid var(--line); min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
    .sidebar-head { padding: 16px; border-bottom: 1px solid var(--line); display: grid; gap: 12px; }
    .sidebar-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .sidebar-title h2 { margin: 0; font-size: 16px; font-weight: 750; letter-spacing: 0; }
    .selected-pill { min-width: 62px; text-align: center; border-radius: 999px; padding: 5px 8px; color: var(--green); background: #eaf5ee; font-size: 12px; font-weight: 700; }
    .sidebar-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .search-box { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
    .search-box input, select { min-height: 34px; border: 1px solid var(--line); background: #fff; border-radius: 6px; color: var(--text); padding: 7px 10px; outline: none; }
    .search-box input:focus, select:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(47, 125, 98, 0.14); }
    .sidebar-scroll { padding: 12px; overflow: auto; min-height: 0; }
    .group-panel { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); margin-bottom: 10px; overflow: hidden; }
    .group-panel summary { list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 11px; background: var(--panel-soft); font-size: 13px; font-weight: 750; cursor: pointer; }
    .group-panel summary::-webkit-details-marker { display: none; }
    .group-actions { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
    .keyword-row { min-height: 34px; padding: 7px 10px; display: flex; align-items: center; gap: 8px; border-top: 1px solid #eef1ec; color: #334155; font-size: 13px; cursor: pointer; }
    .keyword-row:hover { background: #f4faf6; }
    .keyword-row input { accent-color: var(--green); flex-shrink: 0; }
    .keyword-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rank-chip { flex-shrink: 0; color: var(--muted); background: #f1f4ef; border-radius: 999px; padding: 3px 7px; font-size: 11px; }
    .no-match { display: none; color: var(--muted); text-align: center; padding: 22px 8px; font-size: 13px; }

    .main { min-width: 0; min-height: 0; overflow: auto; display: flex; flex-direction: column; }
    .topbar { position: sticky; top: 0; z-index: 20; background: rgba(246, 247, 244, 0.94); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); padding: 14px 18px; display: grid; gap: 12px; }
    .title-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    h1 { margin: 0; color: var(--ink); font-size: clamp(20px, 2vw, 28px); line-height: 1.15; font-weight: 820; letter-spacing: 0; }
    .subline { margin-top: 4px; color: var(--muted); font-size: 13px; }
    .mobile-toggle { display: none; }
    .status { color: var(--muted); font-size: 12px; min-height: 18px; text-align: right; }
    .controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .control { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 13px; }
    .control label { white-space: nowrap; }
    .quick-buttons, .metric-toggles { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .btn { min-height: 34px; border-radius: 6px; padding: 7px 11px; font-size: 13px; font-weight: 700; color: var(--text); background: #fff; border: 1px solid var(--line); }
    .btn:hover { border-color: #bccabd; background: #f8fbf7; }
    .btn.primary { background: var(--green); border-color: var(--green); color: #fff; }
    .btn.primary:hover { background: #276b54; }
    .metric-toggle { min-height: 34px; display: inline-flex; align-items: center; gap: 6px; border-radius: 6px; padding: 7px 10px; background: #fff; border: 1px solid var(--line); font-size: 13px; color: var(--text); cursor: pointer; }
    .metric-toggle input { accent-color: var(--green); }

    .content { padding: 16px 18px 22px; display: grid; gap: 14px; }
    .summary-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .metric-card, .chart-panel, .rank-panel, .notice { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); }
    .metric-card { padding: 14px; min-height: 100px; display: grid; gap: 8px; align-content: start; }
    .metric-label { color: var(--muted); font-size: 12px; font-weight: 700; }
    .metric-value { font-size: 24px; line-height: 1.05; font-weight: 820; color: var(--ink); overflow-wrap: anywhere; }
    .metric-detail { color: var(--muted); font-size: 12px; line-height: 1.35; }
    .metric-card.rain-strong .metric-value { color: var(--rain); }
    .metric-card.rain-dry .metric-value { color: var(--orange); }
    .notice { display: none; padding: 10px 12px; border-color: #f0d39a; background: #fff8e8; color: #7a4c12; font-size: 13px; }
    .notice.show { display: block; }
    .chart-panel { padding: 12px; min-height: 500px; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 10px; }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 2px 2px 0; }
    .panel-title { font-weight: 800; color: var(--ink); }
    .panel-meta { color: var(--muted); font-size: 12px; }
    .chart-wrap { position: relative; min-height: 420px; }
    #myChart { width: 100%; height: 100%; }
    .rank-panel { padding: 14px; display: grid; gap: 12px; }
    .rank-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .rank-box { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    .rank-box h3 { margin: 0; padding: 10px 12px; background: var(--panel-soft); font-size: 14px; color: var(--ink); }
    .rank-list { margin: 0; padding: 0; list-style: none; }
    .rank-list li { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 9px 12px; border-top: 1px solid #edf1ec; font-size: 13px; }
    .rank-list span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rank-list strong { color: var(--rain); }
    .error-panel { display: none; position: fixed; inset: auto 18px 18px auto; max-width: min(520px, calc(100vw - 36px)); z-index: 50; background: #fff6f4; border: 1px solid #f0b8ad; color: #8c2f25; border-radius: 8px; box-shadow: var(--shadow); padding: 12px 14px; font-size: 13px; line-height: 1.45; }
    .error-panel.show { display: block; }
    .sidebar-backdrop { display: none; }

    @media (max-width: 1100px) {
      .summary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 820px) {
      body { overflow: auto; }
      .app-shell { display: block; height: auto; min-height: 100vh; }
      .sidebar { position: fixed; inset: 0 auto 0 0; width: min(86vw, 340px); z-index: 40; transform: translateX(-105%); transition: transform 0.22s ease; box-shadow: var(--shadow); }
      .sidebar.active { transform: translateX(0); }
      .sidebar-backdrop { display: none; position: fixed; inset: 0; background: rgba(31, 41, 51, 0.28); z-index: 35; }
      .sidebar-backdrop.active { display: block; }
      .main { min-height: 100vh; overflow: visible; }
      .topbar { padding: 12px; }
      .title-row { align-items: flex-start; }
      .mobile-toggle { display: inline-flex; align-items: center; justify-content: center; min-width: 42px; min-height: 36px; border-radius: 6px; color: #fff; background: var(--green); }

      .control { align-items: stretch; justify-content: space-between; }
      .control select { min-width: 0; max-width: 62vw; }
      .summary-grid, .rank-grid { grid-template-columns: 1fr; }
      .content { padding: 12px; }
      .chart-panel { min-height: 460px; }
      .chart-wrap { min-height: 360px; }
      .panel-head { display: grid; }
    }

</head>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="关键词筛选">
      <div class="sidebar-head">
        <div class="sidebar-title">
          <h2>关键词分组</h2>
          <span class="selected-pill" id="selectedCount">0 已选</span>
        </div>
        <div class="search-box">
          <input type="search" id="searchInput" placeholder="搜索关键词或分组">
          <button class="btn" id="btnClearSearch">清空</button>
        </div>
        <div class="sidebar-actions">
          <button class="btn primary" id="globalAllBtn">全选</button>
          <button class="btn" id="globalNoneBtn">全不选</button>
        </div>
      </div>
      <div class="sidebar-scroll">
        <div id="groupContainer"></div>
        <div class="no-match" id="noMatchMsg">未找到匹配项</div>
      </div>
    </aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <main class="main">
      <header class="topbar">
        <div class="title-row">
          <button class="mobile-toggle" id="toggleSidebar" aria-label="打开关键词筛选">☰</button>
          <div>
            <h1>亚马逊流量天气罗盘</h1>
            <div class="subline">关键词排名、温湿度与周期累计降水量联动分析</div>
          </div>
          <div class="status" id="loadStatus">准备加载</div>
        </div>
        <div class="controls">
          <div class="control"><label for="citySelect">城市</label><select id="citySelect"></select></div>
          <div class="control"><label for="startWeek">开始</label><select id="startWeek"></select></div>
          <div class="control"><label for="endWeek">结束</label><select id="endWeek"></select></div>
          <div class="quick-buttons" aria-label="周期快捷筛选">
            <button class="btn" data-range="12">近12周</button>
            <button class="btn" data-range="26">近26周</button>
            <button class="btn primary" data-range="52">近52周</button>
            <button class="btn" data-range="all">全部</button>
          </div>
          <div class="metric-toggles" aria-label="气象指标显示">
            <label class="metric-toggle"><input type="checkbox" id="toggleMax" checked> 最高温</label>
            <label class="metric-toggle"><input type="checkbox" id="toggleAvg" checked> 平均温</label>
            <label class="metric-toggle"><input type="checkbox" id="toggleHum" checked> 湿度</label>
            <label class="metric-toggle"><input type="checkbox" id="toggleRain" checked> 降水</label>
          </div>
          <button class="btn primary" id="btnFilter">更新图表</button>
          <button class="btn" id="btnRefresh">重读数据</button>
        </div>
      </header>

      <section class="content">
        <div class="summary-grid">
          <article class="metric-card rain-strong">
            <div class="metric-label">当前范围最湿周期</div>
            <div class="metric-value" id="wettestValue">--</div>
            <div class="metric-detail" id="wettestDetail">等待数据</div>
          </article>
          <article class="metric-card rain-dry">
            <div class="metric-label">当前范围最干周期</div>
            <div class="metric-value" id="driestValue">--</div>
            <div class="metric-detail" id="driestDetail">等待数据</div>
          </article>
          <article class="metric-card">
            <div class="metric-label">最近周期降水</div>
            <div class="metric-value" id="latestRainValue">--</div>
            <div class="metric-detail" id="latestRainDetail">等待数据</div>
          </article>
          <article class="metric-card">
            <div class="metric-label">去年同期对比</div>
            <div class="metric-value" id="yoyRainValue">--</div>
            <div class="metric-detail" id="yoyRainDetail">等待数据</div>
          </article>
        </div>

        <div class="notice" id="crowdNotice">已选择较多关键词，图表可能偏拥挤；可用搜索或分组按钮缩小范围。</div>

        <section class="chart-panel">
          <div class="panel-head">
            <div class="panel-title">趋势图</div>
            <div class="panel-meta" id="chartMeta">关键词排名越靠上代表排名越好；降水为每 7 天累计 mm。</div>
          </div>
          <div class="chart-wrap"><canvas id="myChart"></canvas></div>
        </section>

        <section class="rank-panel">
          <div class="panel-head">
            <div class="panel-title">降水周期排行</div>
            <div class="panel-meta" id="rankMeta">按当前城市与时间范围计算</div>
          </div>
          <div class="rank-grid">
            <div class="rank-box"><h3>降水最多 Top 5</h3><ol class="rank-list" id="wetRankList"></ol></div>
            <div class="rank-box"><h3>降水最少 Top 5</h3><ol class="rank-list" id="dryRankList"></ol></div>
          </div>
        </section>
      </section>
    </main>
  </div>
  <div class="error-panel" id="errorPanel"></div>

      els.citySelect.innerHTML = "";
      state.availableCities.forEach(city => els.citySelect.add(new Option(CITY_LABELS[city] || city, city)));
      els.citySelect.value = state.availableCities.includes(CONFIG.DEFAULT_CITY) ? CONFIG.DEFAULT_CITY : state.availableCities[0];
      state.city = els.citySelect.value;
    }
    function populateWeekSelects() {
      els.startWeek.innerHTML = ""; els.endWeek.innerHTML = "";
      state.labelsAll.forEach((week, i) => {
        const txt = formatWeek(week);
        els.startWeek.add(new Option(txt, i)); els.endWeek.add(new Option(txt, i));
      });
      setQuickRange(52, false);
    }
    function setQuickRange(size, shouldUpdate = true) {
      const end = Math.max(0, state.labelsAll.length - 1);
      const start = size === "all" ? 0 : Math.max(0, end - Number(size) + 1);
      els.startWeek.value = String(start); els.endWeek.value = String(end);
      if (shouldUpdate) updateDashboard();
    }
    function getRange() {
      const s = parseInt(els.startWeek.value, 10) || 0;
      const e = parseInt(els.endWeek.value, 10) || 0;
      return { start: Math.min(s, e), end: Math.max(s, e) };
    }
    function getLatestValue(arr) {
      for (let i = arr.length - 1; i >= 0; i--) if (Number.isFinite(arr[i])) return arr[i];
      return NaN;
    }
    function renderGroupSidebar(groups) {
      els.groupContainer.innerHTML = "";
      Object.keys(groups).forEach(group => {
        const details = document.createElement("details");
        details.className = "group-panel"; details.open = true;
        const summary = document.createElement("summary");
        const title = document.createElement("span"); title.textContent = group;
        const actions = document.createElement("span"); actions.className = "group-actions";
        const allBtn = document.createElement("button"); allBtn.className = "btn"; allBtn.type = "button"; allBtn.textContent = "全";
        allBtn.addEventListener("click", event => { event.preventDefault(); event.stopPropagation(); setGroupCheck(group, true); });
        const noneBtn = document.createElement("button"); noneBtn.className = "btn"; noneBtn.type = "button"; noneBtn.textContent = "无";
        noneBtn.addEventListener("click", event => { event.preventDefault(); event.stopPropagation(); setGroupCheck(group, false); });
        actions.append(allBtn, noneBtn); summary.append(title, actions); details.appendChild(summary);
        Object.keys(groups[group]).map(keyword => ({ keyword, latest: getLatestValue(groups[group][keyword]) }))
          .sort((a, b) => (Number.isFinite(a.latest) ? a.latest : 999999) - (Number.isFinite(b.latest) ? b.latest : 999999))
          .forEach(item => {
            const label = document.createElement("label"); label.className = "keyword-row";
            const checkbox = document.createElement("input"); checkbox.type = "checkbox"; checkbox.checked = true; checkbox.dataset.group = group; checkbox.dataset.keyword = item.keyword;
            const name = document.createElement("span"); name.className = "keyword-name"; name.textContent = item.keyword;
            const rank = document.createElement("span"); rank.className = "rank-chip"; rank.textContent = Number.isFinite(item.latest) ? `#${item.latest}` : "--";
            label.append(checkbox, name, rank); details.appendChild(label);
          });
        els.groupContainer.appendChild(details);
      });
      updateSelectedCount(); applySearchFilter(els.searchInput.value || "");
    }
    function setGroupCheck(group, checked) {
      document.querySelectorAll(`input[data-group="${CSS.escape(group)}"]`).forEach(cb => cb.checked = checked);
      updateDashboard();
    }
    function updateSelectedCount() {
      const selected = document.querySelectorAll('#groupContainer input[type="checkbox"]:checked').length;
      els.selectedCount.textContent = `${selected} 已选`;
      els.crowdNotice.classList.toggle("show", selected > CONFIG.MAX_KEYWORD_HINT);
      return selected;
    }
    function debounce(fn, wait) {
      let timer;
      return (...args) => { clearTimeout(timer); timer = setTimeout(() => fn(...args), wait); };
    }
    function applySearchFilter(term) {
      const query = term.trim().toLowerCase();
      let visiblePanels = 0;
      document.querySelectorAll(".group-panel").forEach(panel => {
        const groupName = panel.querySelector("summary span").textContent.toLowerCase();
        const labels = panel.querySelectorAll(".keyword-row");
        const panelMatch = groupName.includes(query);
        let keywordMatches = 0;
        labels.forEach(label => {
          const isMatch = panelMatch || label.textContent.toLowerCase().includes(query);
          label.style.display = isMatch ? "" : "none";
          if (isMatch) keywordMatches += 1;
        });
        const visible = !query || panelMatch || keywordMatches > 0;
        panel.style.display = visible ? "" : "none";
        if (visible) visiblePanels += 1;
      });
      els.noMatchMsg.style.display = visiblePanels === 0 ? "block" : "none";
    }
    function selectedKeywordDatasets(start, end) {
      const boxes = document.querySelectorAll('#groupContainer input[type="checkbox"]:checked');
      const values = [], datasets = [];
      let index = 0;
      boxes.forEach(box => {
        const group = box.dataset.group, keyword = box.dataset.keyword;
        const full = state.globalGroupsRaw[group]?.[keyword] || [];
        const data = full.slice(start, end + 1);
        data.forEach(v => { if (Number.isFinite(v)) values.push(v); });
        const color = keywordColors[index % keywordColors.length];
        datasets.push({ type: "line", label: keyword, data, borderColor: color, backgroundColor: color, borderWidth: 2, pointRadius: data.length > 40 ? 1.6 : 2.8, pointHoverRadius: 4, tension: 0.22, yAxisID: "yTraffic", order: 2, groupName: group, keywordName: keyword });
        index += 1;
      });
      return { datasets, values };
    }
    function weatherDatasets(start, end) {
      const slice = arr => arr.slice(start, end + 1);
      const datasets = [];
      if (els.toggleRain.checked) datasets.push({ type: "bar", label: "累计降水(mm)", data: slice(state.weatherData.rain), backgroundColor: "rgba(50, 122, 156, 0.22)", borderColor: "rgba(50, 122, 156, 0.72)", borderWidth: 1, yAxisID: "yRain", order: 9, categoryPercentage: 0.78, barPercentage: 0.9 });
      if (els.toggleMax.checked) datasets.push({ type: "line", label: "最高气温", data: slice(state.weatherData.max), borderColor: "#bf4a3d", borderDash: [8, 4], borderWidth: 2, pointRadius: 0, tension: 0.32, yAxisID: "yTemp", order: 8 });
      if (els.toggleAvg.checked) datasets.push({ type: "line", label: "平均气温", data: slice(state.weatherData.avg), borderColor: "#c26a2e", borderDash: [5, 3], borderWidth: 2, pointRadius: 0, tension: 0.32, yAxisID: "yTemp", order: 8 });
      if (els.toggleHum.checked) datasets.push({ type: "line", label: "最小湿度(%)", data: slice(state.weatherData.hum), borderColor: "#2f6f9f", borderDash: [9, 4], borderWidth: 2, pointRadius: 0, tension: 0.32, yAxisID: "yHum", order: 8 });
      return datasets;
    }
    function updateChart(start, end) {
      const weeks = state.labelsAll.slice(start, end + 1);
      const { datasets: keywordSets, values } = selectedKeywordDatasets(start, end);
      const allDatasets = [...weatherDatasets(start, end), ...keywordSets];
      const rankMin = values.length ? Math.max(1, Math.floor(Math.min(...values) * 0.85)) : 1;
      const rankMax = values.length ? Math.ceil(Math.max(...values) * 1.1) : 100;
      const labels = weeks.map(formatWeek);
      const ctx = document.getElementById("myChart").getContext("2d");
      const options = {
        responsive: true, maintainAspectRatio: false, interaction: { mode: "index", intersect: false }, animation: { duration: state.chart ? 160 : 360 },
        scales: {
          x: { grid: { display: false }, ticks: { maxRotation: 0, autoSkip: true, maxTicksLimit: 12 } },
          yTraffic: { display: false, reverse: true, min: rankMin, max: rankMax },
          yTemp: { type: "linear", display: els.toggleMax.checked || els.toggleAvg.checked, position: "left", title: { display: true, text: "气温 (C)", color: "#9b3d32" }, ticks: { color: "#9b3d32" }, grid: { color: "rgba(31, 41, 51, 0.06)" } },
          yHum: { type: "linear", display: els.toggleHum.checked, position: "right", min: 0, max: 100, title: { display: true, text: "湿度 (%)", color: "#2f6f9f" }, ticks: { color: "#2f6f9f", callback: v => `${v}%` }, grid: { drawOnChartArea: false } },
          yRain: { type: "linear", display: els.toggleRain.checked, position: "right", beginAtZero: true, title: { display: true, text: "降水 (mm)", color: "#327a9c" }, ticks: { color: "#327a9c" }, grid: { drawOnChartArea: false } }
        },
        plugins: {
          legend: { position: "top", labels: { boxWidth: 10, usePointStyle: true } },
          tooltip: {
            backgroundColor: "rgba(31, 41, 51, 0.92)", padding: 12, cornerRadius: 8,
            callbacks: {
              title(items) {
                const currentIndex = start + items[0].dataIndex;
                const current = formatWeek(state.labelsAll[currentIndex]);
                const past = state.labelsAll[currentIndex - 52] ? formatWeek(state.labelsAll[currentIndex - 52]) : null;
                return past ? `${current} | 去年同期 ${past}` : current;
              },
              label(ctx) {
                const label = ctx.dataset.label || "", value = ctx.parsed.y, currentIndex = start + ctx.dataIndex, pastIndex = currentIndex - 52;
                if (label.includes("降水")) {
                  const past = pastIndex >= 0 ? state.weatherData.rain[pastIndex] : NaN;
                  return `累计降水: ${formatNumber(value, " mm")}${Number.isFinite(past) ? ` (去年 ${formatNumber(past, " mm")})` : ""}`;
                }
                if (label.includes("气温")) {
                  const source = label.includes("最高") ? state.weatherData.max : state.weatherData.avg;
                  const past = pastIndex >= 0 ? source[pastIndex] : NaN;
                  return `${label}: ${formatNumber(value, " C")}${Number.isFinite(past) ? ` (去年 ${formatNumber(past, " C")})` : ""}`;
                }
                if (label.includes("湿度")) {
                  const past = pastIndex >= 0 ? state.weatherData.hum[pastIndex] : NaN;
                  return `最小湿度: ${formatNumber(value, "%")}${Number.isFinite(past) ? ` (去年 ${formatNumber(past, "%")})` : ""}`;
                }
                const group = ctx.dataset.groupName, keyword = ctx.dataset.keywordName;
                const past = pastIndex >= 0 && state.globalGroupsRaw[group]?.[keyword] ? state.globalGroupsRaw[group][keyword][pastIndex] : NaN;
                return `${label}: 第 ${value} 名${Number.isFinite(past) ? ` (去年 第 ${past} 名)` : ""}`;
              }
            }
          }
        }
      };
      if (!state.chart) state.chart = new Chart(ctx, { type: "line", data: { labels, datasets: allDatasets }, options });
      else { state.chart.data.labels = labels; state.chart.data.datasets = allDatasets; state.chart.options = options; state.chart.update(); }
      els.chartMeta.textContent = `${CITY_LABELS[state.city] || state.city} | ${formatWeek(state.labelsAll[start])} 至 ${formatWeek(state.labelsAll[end])} | ${keywordSets.length} 个关键词`;
    }
    function rainRows(start, end) {
      return state.weatherData.rain.slice(start, end + 1).map((value, offset) => ({ index: start + offset, value })).filter(item => Number.isFinite(item.value));
    }
    function updateRainInsights(start, end) {
      const rows = rainRows(start, end);
      const labelOf = item => formatWeek(state.labelsAll[item.index]);
      if (!rows.length) {
        [els.wettestValue, els.driestValue, els.latestRainValue, els.yoyRainValue].forEach(el => el.textContent = "--");
        [els.wettestDetail, els.driestDetail, els.latestRainDetail, els.yoyRainDetail].forEach(el => el.textContent = "当前范围没有降水数据");
        els.wetRankList.innerHTML = ""; els.dryRankList.innerHTML = ""; return;
      }
      const wettest = rows.reduce((a, b) => b.value > a.value ? b : a, rows[0]);
      const driest = rows.reduce((a, b) => b.value < a.value ? b : a, rows[0]);
      const latest = rows[rows.length - 1];
      const pastLatest = state.weatherData.rain[latest.index - 52];
      const yoy = Number.isFinite(pastLatest) ? latest.value - pastLatest : NaN;
      els.wettestValue.textContent = formatNumber(wettest.value, " mm"); els.wettestDetail.textContent = labelOf(wettest);
      els.driestValue.textContent = formatNumber(driest.value, " mm"); els.driestDetail.textContent = labelOf(driest);
      els.latestRainValue.textContent = formatNumber(latest.value, " mm"); els.latestRainDetail.textContent = labelOf(latest);
      els.yoyRainValue.textContent = Number.isFinite(yoy) ? `${yoy >= 0 ? "+" : ""}${formatNumber(yoy, " mm")}` : "--";
      els.yoyRainDetail.textContent = Number.isFinite(pastLatest) ? `去年同期 ${formatNumber(pastLatest, " mm")}` : "没有去年同期数据";
      const renderList = (target, list) => {
        target.innerHTML = "";
        list.forEach(item => {
          const li = document.createElement("li");
          const name = document.createElement("span"); name.textContent = labelOf(item);
          const value = document.createElement("strong"); value.textContent = formatNumber(item.value, " mm");
          li.append(name, value); target.appendChild(li);
        });
      };
      renderList(els.wetRankList, [...rows].sort((a, b) => b.value - a.value).slice(0, 5));
      renderList(els.dryRankList, [...rows].sort((a, b) => a.value - b.value).slice(0, 5));
      els.rankMeta.textContent = `${CITY_LABELS[state.city] || state.city} | ${rows.length} 个有效周期`;
    }
    function updateDashboard() {
      if (!state.loaded) return;
      const { start, end } = getRange();
      updateSelectedCount(); updateChart(start, end); updateRainInsights(start, end);
      setStatus(`已更新 ${new Date().toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" })}`);
    }
    async function loadAllData() {
      setError(""); setStatus("读取 CSV 中...");
      const [kwRes, avgRes, maxRes, humRes, rainRes] = await Promise.all([
        parseCSV(CONFIG.KEYWORDS, FALLBACK_CSV.KEYWORDS),
        parseCSV(CONFIG.TEMP_AVG, FALLBACK_CSV.TEMP_AVG),
        parseCSV(CONFIG.TEMP_MAX, FALLBACK_CSV.TEMP_MAX),
        parseCSV(CONFIG.HUM_MIN, FALLBACK_CSV.HUM_MIN),
        parseCSV(CONFIG.RAIN_TOTAL, FALLBACK_CSV.RAIN_TOTAL)
      ]);
      const processed = processLongRows(convertWideToLong(kwRes.data));
      state.labelsAll = processed.weeks; state.globalGroupsRaw = processed.groups;
      state.rawWeather.avg = avgRes.data; state.rawWeather.max = maxRes.data; state.rawWeather.hum = humRes.data; state.rawWeather.rain = rainRes.data;
      const citySets = [avgRes.data, maxRes.data, humRes.data, rainRes.data].map(getHeaderCities);
      state.availableCities = citySets.reduce((acc, list) => acc.filter(city => list.includes(city)), citySets[0] || []);
      if (!state.availableCities.length) state.availableCities = [CONFIG.DEFAULT_CITY];
      populateCitySelect(); rebuildWeatherForCity(); renderGroupSidebar(state.globalGroupsRaw); populateWeekSelects();
      state.loaded = true; updateDashboard();
    }
    function toggleSidebar(force) {
      const next = force === undefined ? !els.sidebar.classList.contains("active") : force;
      els.sidebar.classList.toggle("active", next); els.sidebarBackdrop.classList.toggle("active", next);
    }
    function bindEvents() {
      els.toggleSidebar.addEventListener("click", () => toggleSidebar());
      els.sidebarBackdrop.addEventListener("click", () => toggleSidebar(false));
      els.btnRefresh.addEventListener("click", () => loadAllData().catch(handleLoadError));
      els.btnFilter.addEventListener("click", updateDashboard);
      els.citySelect.addEventListener("change", () => { state.city = els.citySelect.value; rebuildWeatherForCity(); updateDashboard(); });
      [els.startWeek, els.endWeek, els.toggleMax, els.toggleAvg, els.toggleHum, els.toggleRain].forEach(el => el.addEventListener("change", updateDashboard));
      document.querySelectorAll("[data-range]").forEach(btn => btn.addEventListener("click", () => setQuickRange(btn.dataset.range)));
      els.groupContainer.addEventListener("change", event => { if (event.target.type === "checkbox") updateDashboard(); });
      els.globalAllBtn.addEventListener("click", () => { document.querySelectorAll('#groupContainer input[type="checkbox"]').forEach(cb => cb.checked = true); updateDashboard(); });
      els.globalNoneBtn.addEventListener("click", () => { document.querySelectorAll('#groupContainer input[type="checkbox"]').forEach(cb => cb.checked = false); updateDashboard(); });
      els.searchInput.addEventListener("input", debounce(event => applySearchFilter(event.target.value), 120));
      els.btnClearSearch.addEventListener("click", () => { els.searchInput.value = ""; applySearchFilter(""); });
    }
    function handleLoadError(error) {
      console.error(error); setStatus("加载失败");
      setError("数据加载失败：请确认 Google Sheets 发布 CSV 可访问，尤其是 Rain_Total_Weekly 降水周报。刷新页面或重读数据后仍失败时，请检查发布设置。");
    }
    function initApp() {
      bindElements();
      bindEvents();
      loadAllData().catch(handleLoadError);
    }
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", initApp, { once: true });
    else initApp();
  </script>
</body>
</html>
