<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>亚马逊关键词流量波动+天气记录 (Final Layout)</title>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <style>
    /* === 样式保持不变 === */
    html, body { margin: 0; padding: 0; height: 100%; font-family: sans-serif; overflow: hidden; }
    .sidebar-toggle { position: fixed; left: 0; top: 0; background: #3b5998; color: #fff; padding: 8px 12px; border: none; cursor: pointer; z-index: 9999; }
    .sidebar { position: fixed; left: 0; top: 0; width: 280px; height: 100vh; background: #fafafa; box-shadow: 2px 0 5px rgba(0,0,0,0.2); transform: translateX(-100%); transition: transform 0.3s; padding: 10px; box-sizing: border-box; overflow-y: auto; z-index: 9998; padding-top: 50px; }
    .sidebar.active { transform: translateX(0); }
    .sidebar h3 { margin: 0 0 6px 0; display: flex; align-items: center; gap: 4px; font-size: 16px; }
    .search-row { display: flex; align-items: center; gap: 4px; margin-bottom: 8px; }
    .search-row input { flex: 1; padding: 4px 6px; font-size: 14px; }
    .search-row button { font-size: 12px; cursor: pointer; padding: 4px 8px; }
    .group-panel { margin-bottom: 6px; border: 1px solid #ccc; border-radius: 4px; }
    summary { background: #eee; padding: 6px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: space-between; font-size: 14px; }
    summary button { font-size: 11px; cursor: pointer; margin-left: 8px; }
    label { display: block; margin-left: 10px; font-size: 13px; margin-top: 4px; cursor: pointer; }
    #noMatchMsg { display: none; color: #999; margin-top: 8px; }
    
    .main-area { margin-left: 0; display: flex; flex-direction: column; height: 100vh; transition: margin-left 0.3s; }
    .topbar { background: #f0f0f0; padding: 10px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; flex-wrap: wrap; border-bottom: 1px solid #ccc; }
    .topbar h1 { margin: 0; flex: 1; font-size: 18px; color: #333; }
    .chart-container { flex: 1; position: relative; overflow: hidden; padding: 10px; }
    #myChart { width: 100%; height: 100%; }
  </style>
</head>

<body>
  <button class="sidebar-toggle" id="toggleSidebar">☰</button>

  <div class="sidebar" id="sidebar">
    <h3>
      分组
      <button id="globalAllBtn">全选</button>
      <button id="globalNoneBtn">全不选</button>
    </h3>
    <div class="search-row">
      <input type="text" id="searchInput" placeholder="搜索分组或关键词...">
      <button id="btnClearSearch">X</button>
    </div>
    <div id="groupContainer"></div>
    <div id="noMatchMsg">未找到匹配项</div>
  </div>

  <div class="main-area">
    <div class="topbar">
      <h1>亚马逊流量 vs 东京天气 (Tokyo Data)</h1>
      <button id="btnRefresh">刷新数据</button>
      <label>开始周:</label>
      <select id="startWeek"></select>
      <label>结束周:</label>
      <select id="endWeek"></select>
      <button id="btnFilter">更新区间</button>
    </div>
    <div class="chart-container">
      <canvas id="myChart"></canvas>
    </div>
  </div>

  <script>
    /***************************************************************
     * 1) CSV 链接配置
     ***************************************************************/
    const CONFIG = {
      KEYWORDS: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRZDfuQ2jAEp4ubqgf3XxX6lAHwAtvw2yD1-kaVmR_IBQPr3D_QMeuFv7Djhl5J9rGiOfdhq2mr2zv3/pub?output=csv",
      TEMP_AVG: "https://docs.google.com/spreadsheets/d/e/2PACX-1vTkcoK-1HntqP75oIosaMpzRBKgu866O3G-FO-anKOpzJxzfJR3kFnP3KqPD-8r6huafCa6xD5Q8uVD/pub?gid=1347452649&single=true&output=csv",
      TEMP_MAX: "https://docs.google.com/spreadsheets/d/e/2PACX-1vTkcoK-1HntqP75oIosaMpzRBKgu866O3G-FO-anKOpzJxzfJR3kFnP3KqPD-8r6huafCa6xD5Q8uVD/pub?gid=518852681&single=true&output=csv",
      HUM_MIN:  "https://docs.google.com/spreadsheets/d/e/2PACX-1vTkcoK-1HntqP75oIosaMpzRBKgu866O3G-FO-anKOpzJxzfJR3kFnP3KqPD-8r6huafCa6xD5Q8uVD/pub?gid=1798788448&single=true&output=csv",
      TARGET_CITY: "Tokyo"
    };

    /***************************************************************
     * 2) 全局变量
     ***************************************************************/
    let chart;
    let labelsAll = [];
    let groupsData = {};      
    let globalGroupsRaw = {}; 
    let weatherData = { avg: [], max: [], hum: [] }; 

    /***************************************************************
     * 3) CSV 下载器 (带代理)
     ***************************************************************/
    function parseCSVWithRetry(url) {
      const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url);
      return new Promise((resolve, reject) => {
        Papa.parse(proxyUrl, {
          download: true, header: false, skipEmptyLines: true,
          complete: res => resolve(res),
          error: () => {
            console.warn("代理失败，尝试直连...");
            Papa.parse(url, {
              download: true, header: false, skipEmptyLines: true,
              complete: res => resolve(res),
              error: finalErr => reject(finalErr)
            });
          }
        });
      });
    }

    /***************************************************************
     * 4) 数据处理函数
     ***************************************************************/
    function convertWideToLong(raw2D) {
      if (!raw2D || raw2D.length === 0) return [];
      const rowGroup = raw2D[0];
      const rowKeyword = raw2D[1];
      const out = [];
      for (let r = 2; r < raw2D.length; r++) {
        const row = raw2D[r];
        if (!row[0]) continue;
        const fileName = row[0];
        for (let c = 1; c < row.length; c++) {
          const grp = rowGroup[c];
          const kw = rowKeyword[c];
          const val = parseFloat(row[c] || 0);
          out.push({ week_label: fileName, group: grp, keyword: kw, value: val });
        }
      }
      return out;
    }

    function processLongRows(longData) {
      const setWeeks = new Set();
      longData.forEach(it => setWeeks.add(it.week_label));
      const weeks = Array.from(setWeeks).sort();
      const gData = {};
      const count = weeks.length;
      longData.forEach(it => {
        const w = it.week_label;
        const g = it.group;
        const k = it.keyword;
        const v = it.value;
        if (!gData[g]) gData[g] = {};
        if (!gData[g][k]) gData[g][k] = new Array(count).fill(NaN);
        const idx = weeks.indexOf(w);
        gData[g][k][idx] = v;
      });
      const sorted = {};
      Object.keys(gData).sort().forEach(gName => {
        const kwMap = gData[gName];
        const sortedKwMap = {};
        Object.keys(kwMap).sort().forEach(kName => sortedKwMap[kName] = kwMap[kName]);
        sorted[gName] = sortedKwMap;
      });
      return { weeks, groups: sorted };
    }

    function extractCityWeather(raw2D, targetWeeks) {
      if (!raw2D || raw2D.length < 2) return new Array(targetWeeks.length).fill(NaN);
      const header = raw2D[0];
      let cityIdx = header.indexOf(CONFIG.TARGET_CITY);
      if (cityIdx === -1) { console.warn(`未找到城市 ${CONFIG.TARGET_CITY}，尝试使用第2列`); cityIdx = 1; }
      const map = {};
      for (let r = 1; r < raw2D.length; r++) {
        const row = raw2D[r];
        const week = row[0];
        const val = parseFloat(row[cityIdx]);
        map[week] = isNaN(val) ? null : val;
      }
      return targetWeeks.map(wk => map[wk] !== undefined ? map[wk] : NaN);
    }

    /***************************************************************
     * 6) 图表渲染 (核心修改区)
     ***************************************************************/
    function createChart(weeks, dsList) {
      const ctx = document.getElementById("myChart").getContext("2d");
      if (chart) chart.destroy();

      const startIdx = labelsAll.indexOf(weeks[0]);
      const endIdx = labelsAll.indexOf(weeks[weeks.length-1]);
      const sliceW = (arr) => arr.slice(startIdx, endIdx + 1);

      // === 修改点: 样式调整 ===
      
      // 1. 最高气温 (红虚线)
      dsList.push({
        label: "最高气温", data: sliceW(weatherData.max),
        borderColor: "rgba(231, 76, 60, 1.0)", // 不透明红
        borderWidth: 2, borderDash: [8, 4],
        pointRadius: 0, fill: false, tension: 0.4,
        yAxisID: "yTemp"
      });

      // 2. 平均气温 (橙色虚线 - 已修正!)
      dsList.push({
        label: "平均气温", data: sliceW(weatherData.avg),
        borderColor: "rgba(255, 159, 64, 1.0)", // 纯橙色
        borderWidth: 2, borderDash: [6, 3], // 虚线
        pointRadius: 0, 
        fill: false, // 去掉填充!
        tension: 0.4, 
        yAxisID: "yTemp"
      });

      // 3. 最小湿度 (蓝虚线)
      dsList.push({
        label: "最小湿度(%)", data: sliceW(weatherData.hum),
        borderColor: "rgba(52, 152, 219, 0.8)", borderWidth: 2, borderDash: [10, 5],
        pointRadius: 0, fill: false, tension: 0.4,
        yAxisID: "yHum"
      });

      const formattedLabels = weeks.map(w => w.split("_Week_")[0].replace(/_/g, "-"));

      chart = new Chart(ctx, {
        type: "line",
        data: { labels: formattedLabels, datasets: dsList },
        options: {
          responsive: true, maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          scales: {
            x: { title: { display: true, text: "日期 (Date)" }, grid: { display: false } },
            
            // === 修改点: 坐标轴大清洗 ===
            
            // 隐藏的流量轴 (保留逻辑，隐藏显示)
            yTraffic: {
              display: false, // 隐藏轴线和刻度!
              position: 'left',
              // reverse: true, // 如果您看排名需要反转，请取消注释
            },

            // 左轴：气温 (替代左侧)
            yTemp: {
              type: 'linear', display: true, position: 'left',
              title: { display: true, text: "气温 (°C)", color: "#c0392b" },
              ticks: { color: "#c0392b" }
            },
            
            // 右轴：湿度
            yHum: {
              type: 'linear', display: true, position: 'right',
              title: { display: true, text: "湿度 (%)", color: "#2980b9" },
              grid: { drawOnChartArea: false },
              ticks: { color: "#2980b9", callback: function(value) { return value + "%"; } },
              min: 0, max: 100
            }
          },
          plugins: {
            legend: { labels: { usePointStyle: true, boxWidth: 6 } },
            tooltip: {
              bodyFont: { size: 13 },
              callbacks: {
                label: function(ctx) {
                  let lbl = ctx.dataset.label || "";
                  let val = ctx.parsed.y;
                  if (lbl.includes("气温")) return `${lbl}: ${val}°C`;
                  if (lbl.includes("湿度")) return `${lbl}: ${val}%`;
                  return `${lbl}: ${val}`;
                }
              }
            }
          }
        }
      });
    }

    /***************************************************************
     * 7) 辅助逻辑
     ***************************************************************/
    function getLatestValue(arr) {
      if (!arr || arr.length === 0) return NaN;
      for(let i=arr.length-1; i>=0; i--){ if(arr[i] !== null && !isNaN(arr[i])) return arr[i]; }
      return NaN;
    }

    function renderGroupSidebar(gData) {
      const container = document.getElementById("groupContainer");
      const noMatchMsg = document.getElementById("noMatchMsg");
      container.innerHTML = ""; noMatchMsg.style.display = "none";
      let totalGroups = 0;
      Object.keys(gData).forEach(grp => {
        totalGroups++;
        const details = document.createElement("details"); details.className = "group-panel"; details.open = true; 
        const summary = document.createElement("summary");
        summary.innerHTML = `<span>${grp}</span> <span><button onclick="setGroupCheck('${grp}', true, event)">全选</button><button onclick="setGroupCheck('${grp}', false, event)">全不选</button></span>`;
        details.appendChild(summary);
        const kwMap = gData[grp];
        let kwArray = Object.keys(kwMap).map(kw => ({ kw, latestVal: getLatestValue(kwMap[kw]), arr: kwMap[kw] }));
        kwArray.sort((a, b) => (b.latestVal || 0) - (a.latestVal || 0));
        kwArray.forEach(obj => {
          const lb = document.createElement("label"); const cb = document.createElement("input");
          cb.type = "checkbox"; cb.checked = true; cb.dataset.group = grp; cb.dataset.keyword = obj.kw;
          let valText = isNaN(obj.latestVal) ? "-" : obj.latestVal;
          lb.appendChild(cb); lb.append(` ${obj.kw} (${valText})`);
          details.appendChild(lb);
        });
        container.appendChild(details);
      });
      if (totalGroups === 0) noMatchMsg.style.display = "";
      container.addEventListener("change", (e) => { if (e.target.type === "checkbox") updateVisibleLines(); });
    }

    function applySearchFilter(term) {
      const s = term.trim().toLowerCase();
      const panels = document.querySelectorAll(".group-panel");
      let visibleCount = 0;
      panels.forEach(p => {
        const grpName = p.querySelector("summary span").textContent.toLowerCase();
        const labels = p.querySelectorAll("label");
        let hasMatch = false;
        if(grpName.includes(s)) { p.style.display = ""; labels.forEach(l => l.style.display = ""); hasMatch = true; }
        else {
            let kwMatchCount = 0;
            labels.forEach(lb => { const txt = lb.textContent.toLowerCase(); if(txt.includes(s)) { lb.style.display = ""; kwMatchCount++; } else { lb.style.display = "none"; } });
            if(kwMatchCount > 0) { p.style.display = ""; hasMatch = true; } else { p.style.display = "none"; }
        }
        if(hasMatch) visibleCount++;
      });
      document.getElementById("noMatchMsg").style.display = visibleCount === 0 ? "block" : "none";
    }

    function updateVisibleLines() {
      const cbs = document.querySelectorAll('#groupContainer input:checked');
      const dsList = [];
      const colors = ["#e6194b", "#3cb44b", "#ffe119", "#0082c8", "#f58231", "#911eb4", "#f032e6", "#000000"];
      let i = 0;
      const sIdx = parseInt(document.getElementById("startWeek").value) || 0;
      const eIdx = parseInt(document.getElementById("endWeek").value) || (labelsAll.length-1);
      const start = Math.min(sIdx, eIdx); const end = Math.max(sIdx, eIdx);
      cbs.forEach(cb => {
        const grp = cb.dataset.group; const kw = cb.dataset.keyword; const raw = globalGroupsRaw[grp][kw];
        dsList.push({ label: kw, data: raw.slice(start, end+1), borderColor: colors[i % colors.length], fill: false, tension: 0.1, pointRadius: 2, yAxisID: "yTraffic" });
        i++;
      });
      createChart(labelsAll.slice(start, end+1), dsList);
    }

    window.setGroupCheck = function(grp, val, e) { if(e) e.stopPropagation(); document.querySelectorAll(`input[data-group='${grp}']`).forEach(cb => cb.checked = val); updateVisibleLines(); };

    /***************************************************************
     * 8) 主流程
     ***************************************************************/
    async function main() {
      try {
        console.log("开始加载数据...");
        const [kwRes, tAvgRes, tMaxRes, hMinRes] = await Promise.all([
          parseCSVWithRetry(CONFIG.KEYWORDS), parseCSVWithRetry(CONFIG.TEMP_AVG), parseCSVWithRetry(CONFIG.TEMP_MAX), parseCSVWithRetry(CONFIG.HUM_MIN)
        ]);
        const longData = convertWideToLong(kwRes.data);
        const processed = processLongRows(longData);
        labelsAll = processed.weeks; globalGroupsRaw = processed.groups; groupsData = processed.groups;
        weatherData.avg = extractCityWeather(tAvgRes.data, labelsAll);
        weatherData.max = extractCityWeather(tMaxRes.data, labelsAll);
        weatherData.hum = extractCityWeather(hMinRes.data, labelsAll);
        renderGroupSidebar(groupsData);
        const startSel = document.getElementById("startWeek"); const endSel = document.getElementById("endWeek");
        labelsAll.forEach((wk, i) => { const txt = wk.split("_Week_")[0].replace(/_/g, "-"); startSel.add(new Option(txt, i)); endSel.add(new Option(txt, i)); });
        startSel.value = 0; endSel.value = labelsAll.length - 1;
        updateVisibleLines();
        console.log("加载完成！");
      } catch (err) { alert("加载失败: " + err); console.error(err); }
    }

    document.getElementById("toggleSidebar").onclick = () => document.getElementById("sidebar").classList.toggle("active");
    document.getElementById("btnRefresh").onclick = main;
    document.getElementById("btnFilter").onclick = updateVisibleLines;
    document.getElementById("globalAllBtn").onclick = () => { document.querySelectorAll("input[type=checkbox]").forEach(c=>c.checked=true); updateVisibleLines(); };
    document.getElementById("globalNoneBtn").onclick = () => { document.querySelectorAll("input[type=checkbox]").forEach(c=>c.checked=false); updateVisibleLines(); };
    document.getElementById("searchInput").oninput = (e) => applySearchFilter(e.target.value);
    document.getElementById("btnClearSearch").onclick = () => { document.getElementById("searchInput").value=""; applySearchFilter(""); };
    document.addEventListener("DOMContentLoaded", main);
  </script>
</body>
</html>
